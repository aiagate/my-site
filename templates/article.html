<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">

    <link rel="alternate" type="text/markdown" href="{{ markdownPath }}">
    <link rel="describedby" href="/llms.txt">
    <link rel="stylesheet" href="/style.css">
  </head>

  <body>
    {{ siteHeader }}
    <main>
      <article>
        <header>
          <h1>{{ title }}</h1>
          <time datetime="{{ createdAtIso }}">{{ createdAt }}</time>
        </header>

        {{ content }}

        <section
          class="like"
          data-like-slug="{{ slug }}"
          aria-label="この記事にいいね"
        >
          <button class="like__button" type="button">
            ♡ いいね
            <span class="like__count" data-like-count aria-live="polite"
              >—</span
            >
          </button>
          <p class="like__message" data-like-message aria-live="polite"></p>
        </section>
      </article>
    </main>
    <script type="module" src="/likes.js"></script>
  </body>
</html>
